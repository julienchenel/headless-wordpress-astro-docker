# Prépare les branches que Hostinger déploie :
#
# - deploy/backend  : contenu de backend/ prêt à servir (vendor, WordPress et plugins
#                     installés par Composer). Hostinger le clone dans public_html/app
#                     (déploiement Git, pas le déploiement « statique » qui ignore les
#                     dossiers vendor/) et fait un `git pull` à chaque redéploiement.
#                     Le .env de production et les uploads, non suivis, restent en place.
# - deploy/frontend : copie de main. Hostinger (Node.js, app Astro, dossier frontend)
#                     reconstruit le site à chaque push sur cette branche.
#
# WordPress déclenche « wordpress-content-changed » (mu-plugin headless-webhook)
# quand un contenu publié change : seul le frontend est alors reconstruit.

name: Deploy (Hostinger)

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [wordpress-content-changed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  backend:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer:v2

      - name: Installer les dépendances (production)
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Publier sur la branche deploy/backend
        # Historique continu (pas de force push) : Hostinger fait un `git pull` à chaque déploiement.
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          out="$RUNNER_TEMP/backend"
          if git ls-remote --exit-code --heads "$REMOTE" deploy/backend >/dev/null; then
            git clone -q --branch deploy/backend --single-branch "$REMOTE" "$out"
          else
            mkdir -p "$out" && git -C "$out" init -q -b deploy/backend
          fi
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude 'web/wp-content/uploads/' \
            --exclude 'web/wp-content/cache/' \
            --exclude 'web/wp-content/debug.log' \
            backend/ "$out/"
          cd "$out"
          printf '.env\nweb/wp-content/uploads/\nweb/wp-content/cache/\nweb/wp-content/debug.log\n' > .gitignore
          git add -A -f
          if git diff --cached --quiet; then
            echo "Backend inchangé"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Backend ${GITHUB_SHA::7}"
          git push -q "$REMOTE" HEAD:deploy/backend

      - name: Déclencher le déploiement Hostinger (git pull)
        # Appelé après la mise à jour de deploy/backend : un webhook GitHub sur push
        # partirait dès le push sur main, avant que la branche soit prête.
        env:
          WEBHOOK: ${{ secrets.HOSTINGER_BACKEND_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "Secret HOSTINGER_BACKEND_WEBHOOK absent : déploiement du backend à lancer depuis hPanel."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            -H 'Content-Type: application/json' -H 'X-GitHub-Event: push' \
            -d '{"ref":"refs/heads/deploy/backend"}' "$WEBHOOK" >/dev/null
          echo "Déploiement du backend demandé à Hostinger."

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publier sur la branche deploy/frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            # Contenu WordPress modifié : un commit vide suffit à relancer le build Hostinger.
            git commit -q --allow-empty -m "Rebuild : contenu WordPress modifié"
          fi
          git push -q --force origin HEAD:deploy/frontend
