services:
  # --- Backend: WordPress (Bedrock) + PHP-FPM 8.5 + Nginx ---
  # Config WordPress : backend/.env (lu directement par WordPress)
  wordpress:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: wp_headless
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      memcached:
        condition: service_started
    volumes:
      - ./backend:/var/www/html  # Code backend (vendor, web/wp et plugins installés par Composer)
    networks:
      - headless_network
      - proxy
    ports:
      - "8080:80"  # Accès direct de secours (l'adresse normale est http://cms.headless.localhost)
    labels:
      # Aiguilleur local partagé (~/projects/local-proxy)
      - traefik.enable=true
      - traefik.http.routers.headless-cms.rule=Host(`cms.headless.localhost`)
      - traefik.http.services.headless-cms.loadbalancer.server.port=80

  # --- Base de données MySQL 8.0 ---
  mysql:
    image: mysql:8.0
    container_name: wp_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${DB_NAME:-wp_headless}
      - MYSQL_USER=${DB_USER:-wp_user}
      - MYSQL_PASSWORD=${DB_PASSWORD:-wp_password}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-root_password}
    volumes:
      - mysql_data:/var/lib/mysql  # Persistance de la DB
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf  # Config MySQL
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - headless_network
    ports:
      - "127.0.0.1:3307:3306"  # Accès local à MySQL (3307 : le 3306 est pris par le MySQL de WSL)

  # --- Memcached (Cache objet) ---
  memcached:
    image: memcached:1.6
    container_name: wp_memcached
    restart: unless-stopped
    command: -m 256  # 256 Mo de RAM
    networks:
      - headless_network

  # --- Frontend: Astro (serveur de dev) ---
  astro:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: astro_frontend
    restart: unless-stopped
    environment:
      - WP_URL=http://wordpress:80  # WordPress vu depuis le conteneur
      - SITE_URL=http://headless.localhost
    volumes:
      - ./frontend:/app  # Montage du code frontend
      - /app/node_modules  # node_modules isolé dans le conteneur
    networks:
      - headless_network
      - proxy
    ports:
      - "3000:3000"  # Accès direct de secours (l'adresse normale est http://headless.localhost)
    labels:
      - traefik.enable=true
      - traefik.http.routers.headless-front.rule=Host(`headless.localhost`)
      - traefik.http.services.headless-front.loadbalancer.server.port=3000
    depends_on:
      - wordpress

# --- Volumes persistants ---
volumes:
  mysql_data:

# --- Réseaux ---
networks:
  headless_network:
    driver: bridge
  # Aiguilleur local partagé (~/projects/local-proxy) : à démarrer avant ce projet
  proxy:
    external: true
