; --- Mémoire ---
memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M

; --- OPcache : voir conf.d/opcache.ini ---

; --- Session ---
session.save_handler = memcached
session.save_path = "memcached:11211"

; --- Error Reporting ---
; Erreurs PHP dans les logs du conteneur ; WordPress écrit aussi dans
; web/wp-content/debug.log quand WP_DEBUG_LOG=true.
display_errors = Off
log_errors = On
