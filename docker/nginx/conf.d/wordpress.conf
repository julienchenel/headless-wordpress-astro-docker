server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/html/web;
    index index.php;

    client_max_body_size 64M;

    # Redirections relatives : garde le port publié (localhost:8080)
    absolute_redirect off;

    # --- Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Gzip ---
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- Bedrock : l'admin est dans /wp/wp-admin ---
    rewrite ^/wp-admin/?$ /wp/wp-admin/ redirect;
    rewrite ^/wp-login\.php$ /wp/wp-login.php redirect;

    # --- Fichiers sensibles : .env, .git, composer.*, etc. ---
    location ~ /\. {
        deny all;
    }
    location ~* \.(env|log|lock|yml|json)$ {
        deny all;
    }

    # --- Uploads : jamais de PHP ---
    location ~* ^/wp-content/uploads/.*\.php$ {
        deny all;
    }

    # --- Cache statique ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|woff2?|svg)$ {
        expires 365d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- WordPress (pages, REST /wp-json, GraphQL /graphql) ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP-FPM ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }
}
