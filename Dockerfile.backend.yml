# --- Base: PHP 8.5 + FPM + Nginx ---
FROM php:8.5-fpm-alpine AS php

# --- Installer les dépendances système ---
RUN apk add --no-cache \
    nginx \
    supervisor \
    git \
    curl \
    unzip \
    libpng-dev \
    libzip-dev \
    freetype-dev \
    libjpeg-turbo-dev \
    libwebp-dev \
    libxml2-dev \
    oniguruma-dev \
    postgresql-dev \
    memcached-dev \
    && docker-php-ext-configure gd --with-freetype --with-jpeg --with-webp \
    && docker-php-ext-install -j$(nproc) \
        bcmath \
        ctype \
        fileinfo \
        gd \
        mbstring \
        mysqli \
        pdo_mysql \
        tokenizer \
        xml \
        zip \
        opcache \
        memcached \
    && pecl install imagick \
    && docker-php-ext-enable imagick \
    && apk del --no-cache \
        libpng-dev \
        libzip-dev \
        freetype-dev \
        libjpeg-turbo-dev \
        libwebp-dev \
        libxml2-dev \
        oniguruma-dev \
        postgresql-dev \
        memcached-dev

# --- Config PHP (OPcache, Memcached) ---
COPY docker/php/php.ini /usr/local/etc/php/conf.d/php.ini
COPY docker/php/conf.d/opcache.ini /usr/local/etc/php/conf.d/opcache.ini
COPY docker/php/conf.d/memcached.ini /usr/local/etc/php/conf.d/memcached.ini

# --- Installer Composer ---
RUN curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# --- Configurer Nginx ---
COPY docker/nginx/conf.d/wordpress.conf /etc/nginx/conf.d/default.conf
RUN mkdir -p /run/nginx && \
    touch /var/log/nginx/access.log /var/log/nginx/error.log

# --- Configurer Supervisor (pour gérer PHP-FPM + Nginx) ---
RUN echo "[supervisord]\n\
nodaemon=true\n\
\n\
[program:php-fpm]\n\
command=php-fpm85 -F\n\
autostart=true\n\
autorestart=true\n\
\n\
[program:nginx]\n\
command=nginx -g 'daemon off;'\n\
autostart=true\n\
autorestart=true" > /etc/supervisor/conf.d/supervisord.conf

# --- Copier le code WordPress (Bedrock) ---
WORKDIR /var/www/html
COPY backend/composer.json backend/composer.lock ./
COPY backend/.env.exemple ./env
RUN composer install --no-interaction --optimize-autoloader --no-dev

# --- Copier le reste du backend ---
COPY backend/ .

# --- Permissions ---
RUN chown -R www-data:www-data /var/www/html \
    && chmod -R 775 /var/www/html/web/wp-content

# --- Script d'entrée ---
COPY backend/scripts/entrypoint.sh /entrypoint.sh
RUN chmod +x /entrypoint.sh

# --- Démarrer avec Supervisor ---
EXPOSE 80
CMD ["/usr/bin/supervisord", "-c", "/etc/supervisor/conf.d/supervisord.conf"]
